name: Kourosh-AE Android Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Kourosh-AE APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kourosh-AE
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;26.3.11579264 cmake;3.22.1'
          accept-android-sdk-licenses: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build Debug APKs
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload Kourosh-AE APKs
        uses: actions/upload-artifact@v4
        with:
          name: Kourosh-AE-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APKs to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v2.1.3 app/build/outputs/apk/debug/*.apk \
            --repo "${{ github.repository }}" --clobber
